<div class="homeWrapper">
  
  <header class="homeHeader" [ngClass]="{ 'recolhido': menuAberto }">

    <div class="headerLogo">
      <img src="img/ford.svg" alt="Ford Logo">
    </div>

    <button class="hamburgerMenu" (click)="alternarMenu()" 
    [ngClass]="{ 'active': menuAberto }">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="navLinks">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/dashboard">Dashboard</a>
      <button (click)="efetuarLogout()" class="btnLogout">Sair</button>
    </nav>
  </header>

  <main class="homeMain">
    <div class="welcomeCard">
      <h2>Olá, Administrador!</h2>
      <p>
        Seja bem-vindo ao sistema de gestão estratégica da FORD. 
        Monitore e gerencie os dados da frota de veículos conectados de forma ágil.
      </p>
      <a routerLink="/dashboard" class="btnDashboard">Acessar Dashboard</a>
    </div>
  </main>

</div>
