<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FordCoin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <div class="slide1">
                <div class="icon">
                    <img src="./img/1.png" alt="Logo FordCoin">
                </div>
            </div>
            <div class="slide2">
                <div class="content">
                    <form class="login" id="loginForm">
                        <div class="input-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="pwd">Senha</label>
                            <input type="password" id="pwd" name="pwd" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn-login">ENTRAR</button>
                        <p id="mensagem" style="margin-top: 8px; font-size: 11px; font-weight: bold; text-align: center;"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FordCoin. Todos os direitos reservados.</p>
    </footer>

    <script src="./js/login.js"></script>
</body>
</html>
