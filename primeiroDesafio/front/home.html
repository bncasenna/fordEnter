<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FordCoin - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/home.css">
</head>
<body class="home-body">

    <div class="dashboard-wrapper">
        <!-- HEADER COM PERFIL -->
        <header class="home-header">
            <div class="icon">
                <img src="./img/1.png" alt="Logo FordCoin" class="logo">
            </div>

            <div class="header-user-area">
                <div class="user-profile-trigger" id="profileTrigger">
                    <div class="avatar" id="avatarInicial">C</div>
                    <div class="user-details-mini">
                        <span id="nomeUsuario" class="user-name">Cliente</span>
                        <span class="user-role">Conta Ativa</span>
                    </div>
                    <span class="chevron-icon">▾</span>
                </div>

                <!-- MENU DROPDOWN -->
                <div id="profileDropdown" class="profile-dropdown hidden">
                    <div class="dropdown-header">
                        <p class="dropdown-title">Opções da Conta</p>
                    </div>
                    <ul class="dropdown-menu">
                        <li id="btnAbrirPerfil">⚙️ Editar Perfil</li>
                        <li class="divider"></li>
                        <li id="btnLogout" class="logout-item">🚪 Sair</li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- DASHBOARD CENTRAL -->
        <main>
            <section class="section-header">
                <div class="select-wrapper">
                    <label for="tipoContaSelect">Tipo de Conta:</label>
                    <select id="tipoContaSelect" class="custom-select">
                        <option value="corrente">Conta Corrente</option>
                        <option value="poupanca">Conta Poupança</option>
                        <option value="empresarial">Conta Empresarial</option>
                    </select>
                </div>
            </section>

            <div class="cards-grid">
                <!-- CARD SALDO -->
                <div class="balance-card highlight">
                    <div class="card-header-info">
                        <span id="labelTipoConta" class="badge">Conta Corrente</span>
                        <span class="account-number">C/C: 1001-9</span>
                    </div>
                    <h3 class="card-title">Saldo Disponível</h3>
                    <h1 class="balance-amount">R$ <span id="valorSaldo">1.500,00</span></h1>
                    <div class="card-footer-info">
                        <span>ℹ️</span> <span id="descricaoRegra">Taxa de saque: R$ 2,50 por operação.</span>
                    </div>
                </div>

                <!-- CARD REGRAS ESPECÍFICAS -->
                <div class="balance-card">
                    <h3 class="card-title" id="tituloRegraExtra">Informações da Conta</h3>
                    <div class="rule-content" id="conteudoRegraExtra"></div>
                </div>
            </div>

            <!-- PAINEL DE AÇÕES -->
            <section class="operations-section">
                <h3>Operações Financeiras</h3>
                <div class="operations-card">
                    <div class="input-group">
                        <label for="valorOperacao">Valor da Operação (R$)</label>
                        <input type="number" id="valorOperacao" placeholder="0,00" step="0.01">
                    </div>

                    <div class="actions-group">
                        <button id="btnDepositar" class="btn-action btn-deposit">Depositar</button>
                        <button id="btnSacar" class="btn-action btn-withdraw">Sacar</button>
                        <button id="btnRendimento" class="btn-action btn-special hidden">Simular Rendimento (0.5%)</button>
                        <button id="btnEmprestimo" class="btn-action btn-special hidden">Solicitar Empréstimo</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL DE PERFIL -->
    <div id="modalPerfil" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Editar Perfil</h3>
                <button id="btnCloseModal" class="close-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="editNome">Nome do Titular</label>
                    <input type="text" id="editNome" class="modal-input">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnCancelarModal" class="btn-secondary">Cancelar</button>
                <button id="btnSalvarPerfil" class="btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
